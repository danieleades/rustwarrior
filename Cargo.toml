[package]
name = "rustwarrior"
description = "Command-line task tracking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rw"
path = "src/main.rs"

[features]
default = []
mcp = ["dep:rustwarrior-mcp-server"]

[dependencies]
rustwarrior-core = { path = "core" }
rustwarrior-mcp-server = { path = "mcp-server", optional = true }
anyhow = "1.0.68"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"

[dev-dependencies]
shlex = "1.1.0"
tempfile = "3.3.0"
test-case = "3"

[workspace]
members = ["core", "mcp-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danieleades/rustwarrior"
rust-version = "1.86.0"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
#cargo = "warn"

[lints]
workspace = true
